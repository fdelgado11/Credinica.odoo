[options]
; =====================================================================
; Configuración Oficial Optimizada y Segura: Odoo 19 (Producción)
; =====================================================================

; Master password para administrar la base de datos de Odoo (Crear, Duplicar, Borrar, Respaldar)
admin_passwd = CAMBIAR_POR_MASTER_PASSWORD_ODOO_SEGURO_456!

; ---------------------------------------------------------------------
; Conexión a la Base de Datos PostgreSQL (Servicio 'odoo-db' en Docker)
; ---------------------------------------------------------------------
db_host = odoo-db
db_port = 5432
db_user = odoo_user
db_password = CAMBIAR_POR_PASSWORD_POSTGRES_SEGURO_123!
db_maxconn = 64

; ---------------------------------------------------------------------
; Rutas de Módulos (Nativos y Personalizados como Microfinanzas)
; ---------------------------------------------------------------------
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; ---------------------------------------------------------------------
; Configuración de Proxy Inverso (NGINX Proxy Manager)
; ---------------------------------------------------------------------
proxy_mode = True
xmlrpc_port = 8069
longpolling_port = 8072

; ---------------------------------------------------------------------
; Multiprocesamiento (Workers) & Optimización de Memoria (RAM)
; Recomendado para VPS de 2 vCPUs y 4GB RAM (2 Workers HTTP + 1 Cron)
; ---------------------------------------------------------------------
workers = 3
max_cron_threads = 1

; Límite de Memoria por Worker (Soft = 640MB, Hard = 768MB)
limit_memory_soft = 671088640
limit_memory_hard = 805306368

; Límites de tiempo para solicitudes largas (Reportes PDF, importaciones masivas)
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; ---------------------------------------------------------------------
; Seguridad & Buenas Prácticas Oficiales de Odoo Community
; ---------------------------------------------------------------------
; Oculta el gestor de selección de BD en el login (Activar en producción)
list_db = True

; Permite búsquedas insensibles a tildes/acentos en el idioma Español
unaccent = True

; Gestión de Logs
log_level = info
